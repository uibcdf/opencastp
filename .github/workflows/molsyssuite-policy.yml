name: MolSysSuite policy

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-policy:
    # Bounded exception: uibcdf/molsyssuite#73 and uibcdf/opencastp#3.
    # policy-v1.5.2 predates this member and rejects it as UNREGISTERED.
    # Re-enable after a released admission-aware gate passes; review by 2026-12-31.
    if: false
    uses: uibcdf/molsyssuite/.github/workflows/check-python-repository.yaml@policy-v1.5.2

  admission-bootstrap:
    name: Admission bootstrap (bounded policy exception)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check the exception deadline
        run: >-
          python -c 'from datetime import date; assert date.today() <= date(2026, 12, 31), "Expired admission exception: uibcdf/molsyssuite#73"'
      - name: Check out the immutable admission checker
        uses: actions/checkout@v6
        with:
          repository: uibcdf/molsyssuite
          ref: a801b4ae09aa3085228013dbfdead8b3b905868b
          path: .molsyssuite-policy
          persist-credentials: false
      - name: Verify exact checker identity
        run: >-
          python -c 'import subprocess; assert subprocess.check_output(["git", "-C", ".molsyssuite-policy", "rev-parse", "HEAD"], text=True).strip() == "a801b4ae09aa3085228013dbfdead8b3b905868b"'
      - name: Check repository conformance
        run: >-
          python .molsyssuite-policy/devtools/scripts/check_repository.py .
          --repository "${{ github.repository }}" --skip-guide-content
      - name: Install the inherited Ruff version
        run: python -m pip install --disable-pip-version-check ruff==0.16.5
      - name: Check Python lint and imports
        run: ruff check --force-exclude --exclude .molsyssuite-policy .
      - name: Check Python formatting
        run: ruff format --check --force-exclude --exclude .molsyssuite-policy .
